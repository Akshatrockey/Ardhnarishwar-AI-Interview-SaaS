[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# MySQL Production Connection
sqlalchemy.url = mysql+pymysql://ardhnarishwar_admin:SuperSecurePassword2026!@localhost:3306/ardhnarishwar_saas?charset=utf8mb4

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
